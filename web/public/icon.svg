<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient matching app palette -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>

    <!-- Plate Face Gradient -->
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46" />
      <stop offset="40%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>

    <!-- Handle Gradient -->
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Outer Bevel Stroke Gradient -->
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#52525b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Drop Shadow Filter for Plates -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- PWA Container Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- DUMBBELL GRAPHIC -->
  <g filter="url(#shadow)">
    <!-- Central Bar / Handle -->
    <rect x="160" y="234" width="192" height="44" rx="4" fill="url(#handleGrad)" stroke="#3f3f46" stroke-width="2" />
    
    <!-- Knurled Grip Ring Collars -->
    <path d="M 188 232 L 196 232 L 196 280 L 188 280 Z" fill="#52525b" />
    <path d="M 316 232 L 324 232 L 324 280 L 316 280 Z" fill="#52525b" />

    <!-- Left Plate (Octagonal/Hex Chamfer) -->
    <!-- Outer Rim -->
    <polygon 
      points="74,188 116,146 172,146 214,188 214,324 172,366 116,366 74,324" 
      fill="url(#plateGrad)" 
      stroke="url(#strokeGrad)" 
      stroke-width="5" 
      stroke-linejoin="round"
    />
    <!-- Inner Recess -->
    <polygon 
      points="90,196 124,162 164,162 198,196 198,316 164,350 124,350 90,316" 
      fill="#1c1c1f" 
      opacity="0.8"
    />

    <!-- Right Plate (Octagonal/Hex Chamfer) -->
    <!-- Outer Rim -->
    <polygon 
      points="298,188 340,146 396,146 438,188 438,324 396,366 340,366 298,324" 
      fill="url(#plateGrad)" 
      stroke="url(#strokeGrad)" 
      stroke-width="5" 
      stroke-linejoin="round"
    />
    <!-- Inner Recess -->
    <polygon 
      points="314,196 348,162 388,162 422,196 422,316 388,350 348,350 314,316" 
      fill="#1c1c1f" 
      opacity="0.8"
    />

    <!-- Handle Center Inscription Plate -->
    <rect x="204" y="238" width="104" height="36" rx="4" fill="#09090b" stroke="#27272a" stroke-width="1.5" />

    <!-- LIFT Typography -->
    <text 
      x="256" 
      y="265" 
      fill="#f4f4f5" 
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
      font-size="23" 
      font-weight="900" 
      letter-spacing="2.5" 
      text-anchor="middle"
    >
      LIFT
    </text>
  </g>
</svg>
